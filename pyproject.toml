[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keystress"
version = "0.1.0"
description = "A privacy-preserving research prototype for studying whether typing dynamics relate to academic wellbeing"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mirdula R" }]
requires-python = ">=3.9"
keywords = ["typing-dynamics", "keystroke-metadata", "wellbeing-research", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Private :: Do Not Upload",
]

# Lower bounds only here; CI installs from the pinned constraints file so that builds are
# reproducible without making the package itself unusable in other environments (F13).
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.1",
    "joblib>=1.2.0",
    "flask>=2.3.2",
    "flask-limiter>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Mirdula18/Keystress-AI"
Documentation = "https://github.com/Mirdula18/Keystress-AI/tree/main/docs"

[project.scripts]
keystress = "keystress.__main__:main"
keystress-train = "keystress.ml.train:main"
keystress-export = "keystress.research.dataset:main"

[tool.setuptools.packages.find]
include = ["keystress*"]

[tool.setuptools.package-data]
keystress = ["web/*.html", "web/*.css", "web/*.js"]

# --------------------------------------------------------------------------------------
# Tooling
# --------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "privacy: asserts the no-content-capture guarantee (must never be skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes  - catches the unused imports this feature removes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib
    "RET",  # return consistency
    "T20",  # flake8-print - print() is a lint error outside CLI entrypoints
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
# CLI entrypoints and the standalone check tool legitimately print to stdout.
"keystress/__main__.py" = ["T20"]
"keystress/ml/train.py" = ["T20"]
"keystress/ml/synthetic.py" = ["T20"]
"keystress/research/dataset.py" = ["T20"]
"tools/*.py" = ["T20"]
"tests/*.py" = ["T20"]
